[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fatigue-prediction"
version = "0.2.0"
description = "Exploratory, participant-grouped prediction of next-session subjective fatigue"
requires-python = ">=3.11"
dependencies = ["numpy>=1.26,<3", "pandas>=2.2,<4", "scikit-learn>=1.4,<2", "statsmodels>=0.14,<0.16"]

[project.optional-dependencies]
notebook = ["jupyterlab>=4,<5", "nbclient>=0.10,<1", "nbformat>=5,<6", "matplotlib>=3.8,<4"]

[project.scripts]
fatigue = "fatigue_prediction.cli:main"

[tool.setuptools.packages.find]
include = ["fatigue_prediction*"]
